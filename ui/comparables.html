<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark">
<title>Comparables — GCC Car Valuator</title>
<link rel="stylesheet" href="theme.css">
<style>
:root { color-scheme:dark }
body { margin:0;font-family:Inter,-apple-system,sans-serif;background:#050a0f;color:#f7f8fa;display:flex;min-height:100vh }
.sidebar { width:250px;background:#091017;border-right:1px solid rgba(255,255,255,0.04);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto }
.sidebar-brand { display:flex;align-items:center;gap:16px;padding:32px 24px 24px;border-bottom:1px solid rgba(148,163,184,0.11);margin-bottom:16px }
.sidebar-logo { width:42px;height:42px;background:linear-gradient(135deg,#e9a50a,#bf7707);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#f7f8fa;box-shadow:0 0 20px rgba(233,165,10,0.28);flex-shrink:0 }
.sidebar-name { font-size:17px;font-weight:800;letter-spacing:0.08em;line-height:1.1 }
.sidebar-subtitle { font-size:8px;font-weight:500;letter-spacing:0.18em;color:#657180;text-transform:uppercase;white-space:nowrap }
.sidebar-section-label { font-size:12px;font-weight:700;color:#657180;text-transform:uppercase;letter-spacing:0.09em;padding:24px 20px 8px }
.sidebar-nav { padding:0;flex:1;display:flex;flex-direction:column;gap:1px }
.sidebar-nav a { display:flex;align-items:center;gap:12px;padding:10px 18px;margin:0 8px;color:#657180;text-decoration:none;font-size:13px;font-weight:500;border-radius:10px;cursor:pointer;transition:all 150ms ease }
.sidebar-nav a:hover { color:#929cab;background:rgba(255,255,255,0.03) }
.sidebar-nav a.active { color:#f7f8fa;background:linear-gradient(90deg,rgba(200,148,53,0.30),rgba(200,148,53,0.12) 60%,transparent);font-weight:600;border:1px solid rgba(200,148,53,0.25) }
.nav-icon { flex-shrink:0;opacity:0.55 }
.sidebar-nav a:hover .nav-icon,.sidebar-nav a.active .nav-icon { opacity:1 }
.sidebar-footer { padding:16px;border-top:1px solid rgba(148,163,184,0.11);margin-top:auto }
.sidebar-profile { display:flex;align-items:center;gap:16px;padding:16px;border-radius:12px }
.profile-avatar { width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#bf7707,#e9a50a);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#050a0f }
.profile-name { font-size:12.5px;font-weight:600;color:#f7f8fa }
.sidebar-system-health { display:flex;align-items:center;gap:8px;padding:8px 16px 4px }
.health-dot { width:6px;height:6px;border-radius:9999px;background:#14df75;box-shadow:0 0 6px rgba(0,214,107,0.5) }
.main-wrap { flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto }
.toolbar { height:72px;display:flex;align-items:center;justify-content:flex-end;padding:0 32px;background:#091017;border-bottom:1px solid rgba(255,255,255,0.04);flex-shrink:0;position:sticky;top:0;z-index:500 }
.content { flex:1;padding:0 40px 64px;max-width:1060px;width:100% }
.page-title { font-size:34px;font-weight:700;margin-bottom:8px;letter-spacing:-0.03em;line-height:1.15;background:linear-gradient(135deg,#f7f8fa,#929cab 60%,#e9a50a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text }
.page-sub { font-size:14px;color:#657180;margin-bottom:0;font-weight:400;line-height:1.5 }
.page-header { display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px;gap:32px;padding-top:32px }
.card { background:#0e1721;border-radius:14px;padding:24px;border:1px solid rgba(148,163,184,0.11);margin-bottom:24px }
.card h2 { font-size:13px;font-weight:600;color:#657180;letter-spacing:0.06em;text-transform:uppercase;margin:0 }
.card-head { display:flex;justify-content:space-between;align-items:center;margin-bottom:16px }
.list-row { display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(148,163,184,0.11) }
.list-row:last-child { border-bottom:none }
.thumb { width:64px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0 }
.row-main { flex:1;min-width:0 }
.row-main strong { display:block;font-size:14px;font-weight:600;color:#f7f8fa }
.row-main span { font-size:12px;color:#929cab }
.row-end { text-align:right }
.row-end strong { font-family:'JetBrains Mono',monospace;font-size:14px;color:#f7f8fa }
@media (max-width:768px) {
  .sidebar { display:none;position:fixed;z-index:900;width:min(280px,84vw) }
  .sidebar.mobile-open { display:flex }
  .content { padding:0 24px 48px }
  .toolbar { padding:0 24px }
}
</style>
</head>
<body>

<div class="content">
<div class="page-header"><div><h1 class="page-title" id="comp-title">Comparables</h1><p class="page-sub" id="comp-sub">Loading comparable data…</p></div></div>

<div class="card"><div class="card-head"><h2>Comparable listings</h2><span id="comp-count">—</span></div>
<div id="comp-list">
<div class="list-row"><img class="thumb" src="img/cars/land-cruiser.jpg" alt=""><div class="row-main"><strong>Loading…</strong><span>Fetching market data</span></div><div class="row-end"><strong>—</strong></div></div>
</div></div>

<p style="font-size:12px;color:#657180;text-align:center;margin-top:16px">Preview data — connect to API for live comparable listings.</p>
</div>
</div>

<script src="js/lang.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var make = params.get('make'), model = params.get('model');
  if (make) {
    document.getElementById('comp-title').textContent = (model ? make + ' ' + model : make) + ' — Comparables';
    document.getElementById('comp-sub').textContent = 'Loading comparable listings for ' + (model ? make + ' ' + model : make) + '…';
  }
  fetch(API + '/models/' + encodeURIComponent(make) + (model ? '/' + encodeURIComponent(model) : ''), { signal: AbortSignal.timeout(3000) })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var years = data.years || [];
      document.getElementById('comp-sub').textContent = years.length + ' model years available';
      document.getElementById('comp-count').textContent = years.length + ' years';
    })
    .catch(function () {});
})();
</script>
