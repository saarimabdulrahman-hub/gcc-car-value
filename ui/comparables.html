<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark">
<title>Comparables — GCC Car Valuator</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="css/sidebar.css">
<style>
:root { color-scheme:dark }
body { margin:0;font-family:Inter,-apple-system,sans-serif;background:var(--color-canvas);color:var(--color-text-primary);display:flex;min-height:100vh }
.main-wrap { flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto }
.toolbar { height:72px;display:flex;align-items:center;justify-content:flex-end;padding:0 32px;background:var(--color-sidebar);border-bottom:1px solid rgba(255,255,255,0.04);flex-shrink:0;position:sticky;top:0;z-index:500 }
.content { flex:1;padding:0 40px 64px;max-width:1060px;width:100% }
.page-title { font-size:34px;font-weight:700;margin-bottom:8px;letter-spacing:-0.03em;line-height:1.15;background:linear-gradient(135deg,var(--color-text-primary),var(--color-text-secondary) 60%,var(--color-accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text }
.page-sub { font-size:14px;color:var(--color-text-muted);margin-bottom:0;font-weight:400;line-height:1.5 }
.page-header { display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px;gap:32px;padding-top:32px }
.card { background:var(--color-surface-raised);border-radius:14px;padding:24px;border:1px solid rgba(148,163,184,0.11);margin-bottom:24px }
.card h2 { font-size:13px;font-weight:600;color:var(--color-text-muted);letter-spacing:0.06em;text-transform:uppercase;margin:0 }
.card-head { display:flex;justify-content:space-between;align-items:center;margin-bottom:16px }
.list-row { display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(148,163,184,0.11) }
.list-row:last-child { border-bottom:none }
.thumb { width:64px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0 }
.row-main { flex:1;min-width:0 }
.row-main strong { display:block;font-size:14px;font-weight:600;color:var(--color-text-primary) }
.row-main span { font-size:12px;color:var(--color-text-secondary) }
.row-end { text-align:right }
.row-end strong { font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--color-text-primary) }
@media (max-width:768px) {
  .toolbar { padding:0 24px }
}
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
</svg>

<aside id="sidebar" class="sidebar" aria-label="Primary navigation"></aside>

<div class="main-wrap">
<header class="toolbar"></header>

<div class="preview-state" role="note"><strong>Preview data</strong><span>Sample data shown until the live API connects</span></div><div class="content">
<div class="page-header"><div><h1 class="page-title" id="comp-title">Comparables</h1><p class="page-sub" id="comp-sub">Loading comparable data…</p></div></div>

<div class="card"><div class="card-head"><h2>Comparable listings</h2><span id="comp-count">—</span></div>
<div id="comp-list">
<div class="list-row"><img class="thumb" src="img/cars/land-cruiser.jpg" alt=""><div class="row-main"><strong>Loading…</strong><span>Fetching market data</span></div><div class="row-end"><strong>—</strong></div></div>
</div></div>

<p style="font-size:12px;color:var(--color-text-muted);text-align:center;margin-top:16px">Preview data — connect to API for live comparable listings.</p>
</div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/lang.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var make = params.get('make'), model = params.get('model');
  if (make) {
    document.getElementById('comp-title').textContent = (model ? make + ' ' + model : make) + ' — Comparables';
    document.getElementById('comp-sub').textContent = 'Loading comparable listings for ' + (model ? make + ' ' + model : make) + '…';
  }
  fetch(API + '/models/' + encodeURIComponent(make) + (model ? '/' + encodeURIComponent(model) : ''), { signal: AbortSignal.timeout(3000) })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var years = data.years || [];
      document.getElementById('comp-sub').textContent = years.length + ' model years available';
      document.getElementById('comp-count').textContent = years.length + ' years';
    })
    .catch(function () {});
})();
</script>
</body>
</html>
