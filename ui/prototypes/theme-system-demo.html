<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Valuator — Theme System Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #04070b;
      --shell: #071018;
      --surface: #0b151e;
      --surface-raised: #101d27;
      --line: rgba(152, 177, 199, .16);
      --line-strong: rgba(255, 175, 18, .46);
      --text: #f3f5f6;
      --muted: #8fa0ae;
      --quiet: #627482;
      --amber: #f5a600;
      --amber-bright: #ffc133;
      --green: #22e883;
      --red: #ff5360;
      --blue: #4aa5ff;
      --radius: 7px;
      --shadow: 0 18px 44px rgba(0, 0, 0, .25);
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); }
    button { font: inherit; }
    .stage { min-height: 100vh; }
    .app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }

    .sidebar { position: relative; display: flex; flex-direction: column; background: #071018; border-right: 1px solid var(--line); }
    .brand { height: 92px; display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .logo { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--amber); border-radius: 8px; color: var(--amber-bright); font-weight: 800; letter-spacing: -.05em; }
    .brand strong { display: block; font-size: 18px; letter-spacing: .02em; }
    .brand small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; letter-spacing: .09em; }
    .nav { padding: 20px 12px; }
    .nav-label { margin: 0 8px 12px; color: #7691a5; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .nav-label:not(:first-child) { margin-top: 26px; }
    .nav a { display: flex; align-items: center; gap: 13px; height: 44px; padding: 0 12px; margin: 3px 0; border: 1px solid transparent; border-radius: 7px; color: #a7bfd2; text-decoration: none; font-size: 14px; }
    .nav a:hover, .nav a.active { color: #fff; border-color: rgba(245, 166, 0, .55); background: linear-gradient(90deg, rgba(245, 166, 0, .16), rgba(245, 166, 0, .04)); }
    .nav-icon { width: 18px; color: var(--amber); text-align: center; }
    .org { margin: auto 12px 12px; padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: rgba(9, 18, 26, .72); }
    .org b { display: block; font-size: 13px; }
    .org span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }

    .main { min-width: 0; background: var(--bg); }
    .topbar { height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--line); }
    .status { padding: 8px 11px; border: 1px solid rgba(245, 166, 0, .42); border-radius: 6px; color: var(--amber-bright); background: rgba(245, 166, 0, .08); font-size: 11px; }
    .tools { display: flex; align-items: center; gap: 9px; color: var(--muted); }
    .tool { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
    .locale { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .locale button { height: 32px; padding: 0 11px; border: 0; color: var(--muted); background: transparent; cursor: pointer; }
    .locale button.active { color: #fff; background: rgba(255, 255, 255, .07); }

    .content { padding: 30px 32px 54px; }
    .crumb { margin-bottom: 16px; color: #7f9ab0; font-size: 12px; }
    .hero { position: relative; overflow: hidden; min-height: 192px; padding: 27px 30px; border: 1px solid var(--line); border-radius: var(--radius); background: #0a121a; }
    .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(4, 7, 11, .95) 0%, rgba(4, 7, 11, .72) 42%, rgba(4, 7, 11, .08) 100%); }
    .hero-image { position: absolute; inset: 0; background: center 48% / cover no-repeat url('/hero-bg.png'); opacity: .46; filter: saturate(.9) contrast(1.08); }
    .hero-copy { position: relative; z-index: 1; max-width: 540px; }
    .eyebrow { color: var(--amber-bright); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 9px 0 8px; font-size: clamp(34px, 3.3vw, 48px); line-height: 1.02; letter-spacing: -.045em; }
    .hero p { max-width: 570px; margin: 0; color: #c2d0da; font-size: 16px; line-height: 1.45; }
    .hero-actions { position: relative; z-index: 1; display: flex; gap: 9px; margin-top: 22px; }
    .button { min-height: 40px; padding: 0 15px; border: 1px solid var(--line); border-radius: 6px; color: #dbe6ee; background: rgba(9, 17, 24, .84); cursor: pointer; }
    .button.primary { border-color: rgba(245, 166, 0, .7); color: #111; background: var(--amber); }
    .button:hover { border-color: rgba(255, 255, 255, .38); }
    .button.primary:hover { background: var(--amber-bright); }

    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .kpi { padding: 17px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .kpi-label { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .kpi-value { margin-top: 7px; font-size: 27px; font-weight: 750; letter-spacing: -.035em; }
    .kpi-meta { margin-top: 4px; color: var(--quiet); font-size: 12px; }
    .positive { color: var(--green); }

    .section-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr); gap: 14px; margin-top: 14px; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0; font-size: 14px; letter-spacing: .01em; }
    .panel-head span { color: var(--muted); font-size: 12px; }
    .chart { position: relative; height: 258px; padding: 22px 20px 16px; }
    .chart-grid { position: absolute; inset: 24px 20px 42px; display: grid; grid-template-rows: repeat(4, 1fr); }
    .chart-grid i { border-top: 1px solid rgba(142, 171, 192, .1); }
    .chart-lines { position: absolute; inset: 24px 20px 42px; }
    .chart-lines svg { width: 100%; height: 100%; overflow: visible; }
    .axis { position: absolute; right: 20px; bottom: 15px; left: 20px; display: flex; justify-content: space-between; color: var(--quiet); font-size: 10px; }
    .legend { display: flex; gap: 16px; color: var(--muted); font-size: 11px; }
    .legend b { display: inline-block; width: 18px; height: 2px; margin: 0 5px 3px 0; background: var(--amber); }
    .legend b.cool { background: var(--blue); }
    .list { padding: 5px 18px 10px; }
    .list-row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 11px; min-height: 62px; border-bottom: 1px solid rgba(152, 177, 199, .12); }
    .list-row:last-child { border-bottom: 0; }
    .thumb { width: 42px; height: 32px; border-radius: 5px; background: center / cover no-repeat url('/img/cars/toyota-land-cruiser.png'), linear-gradient(135deg, #1c2b36, #0b1117); }
    .list-row strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .list-row small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .list-row em { color: var(--green); font-size: 12px; font-style: normal; }
    .table-panel { grid-column: 1 / -1; }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { padding: 13px 18px; border-bottom: 1px solid rgba(152, 177, 199, .11); text-align: left; }
    .table th { color: var(--quiet); font-size: 10px; letter-spacing: .08em; font-weight: 600; text-transform: uppercase; }
    .table td { color: #d7e2e9; font-size: 12px; }
    .table td strong { color: #fff; }

    .variant-quiet .hero { min-height: 168px; background: linear-gradient(120deg, #0b151e, #0c1822); }
    .variant-quiet .hero-image { opacity: .12; }
    .variant-quiet .hero::after { background: linear-gradient(90deg, rgba(8, 16, 24, .94), rgba(8, 16, 24, .65)); }
    .variant-quiet .hero-actions { margin-top: 15px; }
    .variant-quiet .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .variant-quiet .panel { box-shadow: none; }

    .variant-cinematic .hero { min-height: 232px; border-color: rgba(245, 166, 0, .24); }
    .variant-cinematic .hero-image { opacity: .68; background-position: center 42%; }
    .variant-cinematic .hero::after { background: linear-gradient(90deg, rgba(4, 7, 11, .93) 0%, rgba(4, 7, 11, .63) 43%, rgba(4, 7, 11, .1) 100%), linear-gradient(0deg, rgba(4, 7, 11, .55), transparent 48%); }
    .variant-cinematic .hero-copy { padding-top: 5px; }
    .variant-cinematic .kpi { background: linear-gradient(135deg, rgba(15, 27, 37, .96), rgba(12, 20, 28, .82)); }
    .variant-cinematic .panel { border-color: rgba(245, 166, 0, .2); }

    .variant-editorial .content { padding-top: 40px; }
    .variant-editorial .hero { min-height: 154px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(200px, .6fr); align-items: end; }
    .variant-editorial .hero-image { opacity: .28; background-position: right 40%; }
    .variant-editorial .hero-copy { align-self: center; }
    .variant-editorial .hero-actions { align-self: end; justify-self: end; }
    .variant-editorial .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .variant-editorial .section-grid { grid-template-columns: minmax(0, 1.6fr) minmax(250px, .4fr); }
    .variant-editorial .chart { height: 312px; }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
    .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
    .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
    @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar { height: 58px; padding: 0 16px; }
      .content { padding: 18px 16px 84px; }
      .hero { min-height: 220px; padding: 22px 20px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .section-grid, .variant-editorial .section-grid { grid-template-columns: 1fr; }
      .variant-editorial .hero { display: block; }
      .variant-editorial .hero-actions { justify-self: start; margin-top: 18px; }
      .table-panel { overflow-x: auto; }
      .table { min-width: 640px; }
    }
    @media (max-width: 520px) {
      h1 { font-size: 34px; }
      .tools .tool:nth-child(2) { display: none; }
      .locale { display: none; }
      .hero p { font-size: 14px; }
      .kpis { gap: 8px; }
      .kpi { padding: 13px; }
      .kpi-value { font-size: 23px; }
      .chart { height: 220px; }
    }
  </style>
</head>
<body>
  <div id="stage" class="stage"></div>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Quiet</button>
    <button class="proto-picker-item">Cinematic</button>
    <button class="proto-picker-item">Editorial</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const shell = (variant, content) => `
      <div class="app ${variant}">
        <aside class="sidebar">
          <div class="brand"><div class="logo">CV</div><div><strong>CAR VALUATOR</strong><small>GCC MARKET INTELLIGENCE</small></div></div>
          <nav class="nav" aria-label="Main navigation">
            <p class="nav-label">Main</p>
            <a href="#"><span class="nav-icon">⌂</span>Home</a>
            <a href="#"><span class="nav-icon">◇</span>Buy</a>
            <a href="#"><span class="nav-icon">↗</span>Sell</a>
            <p class="nav-label">Analysis</p>
            <a href="#"><span class="nav-icon">▦</span>Browse</a>
            <a class="active" href="#"><span class="nav-icon">⌁</span>Market</a>
            <a href="#"><span class="nav-icon">▤</span>Reports</a>
            <a href="#"><span class="nav-icon">♡</span>Watchlist</a>
            <p class="nav-label">Admin</p>
            <a href="#"><span class="nav-icon">⚙</span>Settings</a>
          </nav>
          <div class="org"><b>GCC Car Valuator</b><span>Enterprise workspace</span></div>
        </aside>
        <main class="main">
          <header class="topbar">
            <div class="status">Preview data&nbsp;&nbsp; <span style="color:var(--muted)">Not connected to a live workspace</span></div>
            <div class="tools"><button class="tool" aria-label="Search">⌕</button><button class="tool" aria-label="Notifications">♧</button><div class="locale"><button class="active">EN</button><button>AR</button></div></div>
          </header>
          <div class="content">${content}</div>
        </main>
      </div>`;

    const chart = (editorial = false) => `
      <div class="panel chart-panel">
        <div class="panel-head"><h2>Market trend</h2><div class="legend"><span><b></b>2024</span><span><b class="cool"></b>2023</span></div></div>
        <div class="chart">
          <div class="chart-grid"><i></i><i></i><i></i><i></i></div>
          <div class="chart-lines"><svg viewBox="0 0 640 220" preserveAspectRatio="none" aria-label="Market trend chart"><polyline points="0,180 110,142 220,116 330,82 440,62 540,48 640,18" fill="none" stroke="var(--amber)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,196 110,176 220,145 330,126 440,112 540,84 640,52" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></svg></div>
          <div class="axis"><span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span></div>
        </div>
      </div>`;

    const models = `
      <div class="panel"><div class="panel-head"><h2>Top models</h2><span>View all →</span></div><div class="list">
        <div class="list-row"><span class="thumb"></span><div><strong>Toyota Land Cruiser</strong><small>5,071 listings</small></div><em>↑ 4.2%</em></div>
        <div class="list-row"><span class="thumb"></span><div><strong>Nissan Patrol</strong><small>5,154 listings</small></div><em>↑ 2.8%</em></div>
        <div class="list-row"><span class="thumb"></span><div><strong>Toyota Camry</strong><small>6,253 listings</small></div><em>↑ 1.9%</em></div>
        <div class="list-row"><span class="thumb"></span><div><strong>Mercedes-Benz S-Class</strong><small>3,421 listings</small></div><em style="color:var(--red)">↓ 1.2%</em></div>
      </div></div>`;

    const table = `<div class="panel table-panel"><div class="panel-head"><h2>Market by country</h2><span>Updated 2 min ago</span></div><table class="table"><thead><tr><th>Country</th><th>Market size</th><th>YoY change</th><th>Avg. price</th><th>Active listings</th></tr></thead><tbody><tr><td><strong>UAE</strong></td><td>742K</td><td class="positive">↑ 9.1%</td><td>AED 118K</td><td>45K</td></tr><tr><td><strong>Saudi Arabia</strong></td><td>512K</td><td class="positive">↑ 7.0%</td><td>AED 96K</td><td>36K</td></tr><tr><td><strong>Qatar</strong></td><td>214K</td><td class="positive">↑ 6.2%</td><td>AED 115K</td><td>22K</td></tr></tbody></table></div>`;

    const page = (mode) => {
      const editorial = mode === 'variant-editorial';
      const title = editorial ? 'The GCC market, in focus.' : mode === 'variant-cinematic' ? 'Market Overview' : 'Market Overview';
      const copy = editorial ? 'A concise read on movement, supply, and price across the Gulf.' : 'Real-time insights into the GCC automotive market.';
      return shell(mode, `
        <div class="crumb">Home&nbsp;&nbsp;›&nbsp;&nbsp;Market</div>
        <section class="hero"><div class="hero-image"></div><div class="hero-copy"><div class="eyebrow">${editorial ? 'GCC MARKET BRIEF' : 'LIVE GCC INTELLIGENCE'}</div><h1>${title}</h1><p>${copy}</p><div class="hero-actions"><button class="button primary">Explore market</button><button class="button">Export snapshot</button></div></div></section>
        <section class="kpis">
          <div class="kpi"><div class="kpi-label">Total market size</div><div class="kpi-value">AED 1.82B</div><div class="kpi-meta positive">↑ 8.3% YoY</div></div>
          <div class="kpi"><div class="kpi-label">Total sales</div><div class="kpi-value">612K</div><div class="kpi-meta positive">↑ 6.7% YoY</div></div>
          <div class="kpi"><div class="kpi-label">Average car price</div><div class="kpi-value">AED 103K</div><div class="kpi-meta positive">↑ 4.2% YoY</div></div>
          <div class="kpi"><div class="kpi-label">Active listings</div><div class="kpi-value">156K</div><div class="kpi-meta">Across GCC</div></div>
        </section>
        <section class="section-grid">${chart(editorial)}${models}</section>
        ${table}
      `);
    };

    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    const variants = [() => page('variant-quiet'), () => page('variant-cinematic'), () => page('variant-editorial')];
    let current = 0;

    function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
    function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); }); }
    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
      moveHighlight();
      const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
      mount(i);
    }
    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);
    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });
    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
